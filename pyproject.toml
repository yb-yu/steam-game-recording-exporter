[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-game-recording-exporter"
version = "1.1.0"
authors = [{ name = "yb-yu" }]
description = "Export Steam game recordings to MP4 format"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["steam", "recording", "video", "exporter"]
dependencies = [
    "imageio-ffmpeg",
    "requests",
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yb-yu/steam-game-recording-exporter"
Repository = "https://github.com/yb-yu/steam-game-recording-exporter"

[project.scripts]
steamexporter = "steamexporter:main"

[tool.setuptools]
py-modules = ["steamexporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ffmpeg: end-to-end tests that shell out to the bundled ffmpeg (slower)",
]
